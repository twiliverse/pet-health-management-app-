<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawPal | Pet Health Management</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none; /* Let mouse hit the 3D canvas */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle, rgba(255,255,255,0) 40%, rgba(255,255,255,0.7) 100%);
        }
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            pointer-events: auto; /* Re-enable clicks for the card */
            border: 1px solid rgba(255,255,255,1);
        }
        h1 {
            color: #ff6b6b;
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        p {
            color: #555;
            font-size: 1.2rem;
            margin-bottom: 30px;
            max-width: 400px;
        }
        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary {
            background-color: #ff6b6b;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
        }
        .btn-secondary {
            background-color: transparent;
            color: #ff6b6b;
            border: 2px solid #ff6b6b;
        }
        .btn-secondary:hover {
            background-color: #fff0f0;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="card">
            <h1>🐾 PawPal</h1>
            <p>Your comprehensive dashboard for tracking, managing, and optimizing your pet's wellness journey.</p>
            <div class="btn-container">
                <button class="btn btn-primary">Get Started</button>
                <button class="btn btn-secondary">Log In</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. Scene Setup
        const scene = new THREE.Scene();
        // Soft gradient-like background using fog
        scene.background = new THREE.Color(0xfdfbfb);
        scene.fog = new THREE.FogExp2(0xfdfbfb, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 2. Create Custom 3D Object: A Dog Bone
        const boneGroup = new THREE.Group();
        const boneMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, 
            roughness: 0.4,
            metalness: 0.1
        });

        // Bone Shaft
        const cylinderGeo = new THREE.CylinderGeometry(0.6, 0.6, 4, 32);
        const cylinder = new THREE.Mesh(cylinderGeo, boneMaterial);
        
        // Bone Knobs (Spheres at the ends)
        const sphereGeo = new THREE.SphereGeometry(0.9, 32, 32);
        const knob1 = new THREE.Mesh(sphereGeo, boneMaterial);
        knob1.position.set(0.7, 2, 0);
        const knob2 = new THREE.Mesh(sphereGeo, boneMaterial);
        knob2.position.set(-0.7, 2, 0);
        const knob3 = new THREE.Mesh(sphereGeo, boneMaterial);
        knob3.position.set(0.7, -2, 0);
        const knob4 = new THREE.Mesh(sphereGeo, boneMaterial);
        knob4.position.set(-0.7, -2, 0);

        boneGroup.add(cylinder, knob1, knob2, knob3, knob4);
        
        // Position bone slightly to the left so it doesn't block the UI text completely
        boneGroup.position.set(-4, 0, 0);
        boneGroup.rotation.z = Math.PI / 4;
        scene.add(boneGroup);

        // 3. Create "Health Bubbles" background effect
        const bubbleGeo = new THREE.SphereGeometry(0.2, 16, 16);
        const bubbleMat = new THREE.MeshStandardMaterial({
            color: 0xff6b6b,
            transparent: true,
            opacity: 0.6,
            roughness: 0.2
        });

        const bubbles = [];
        for(let i = 0; i < 50; i++) {
            const bubble = new THREE.Mesh(bubbleGeo, bubbleMat);
            bubble.position.set(
                (Math.random() - 0.5) * 30,
                (Math.random() - 0.5) * 30,
                (Math.random() - 0.5) * 20 - 10
            );
            bubble.userData = {
                speed: Math.random() * 0.05 + 0.02,
                wobbleSpeed: Math.random() * 0.05,
                wobbleOffset: Math.random() * Math.PI * 2
            };
            // Random scaling
            const scale = Math.random() * 2 + 0.5;
            bubble.scale.set(scale, scale, scale);
            
            scene.add(bubble);
            bubbles.push(bubble);
        }

        // 4. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffb6b9, 0.8);
        dirLight.position.set(10, 10, 10);
        scene.add(dirLight);

        const backLight = new THREE.DirectionalLight(0x4a90e2, 0.5);
        backLight.position.set(-10, -10, -10);
        scene.add(backLight);

        // 5. Camera Positioning
        camera.position.z = 12;

        // 6. Interactivity (Mouse Parallax)
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - window.innerWidth / 2);
            mouseY = (event.clientY - window.innerHeight / 2);
        });

        // 7. Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Smooth mouse follow
            targetX = mouseX * 0.001;
            targetY = mouseY * 0.001;

            // Animate the Bone
            boneGroup.rotation.y += 0.05 * (targetX - boneGroup.rotation.y) + 0.005;
            boneGroup.rotation.x += 0.05 * (targetY - boneGroup.rotation.x);
            boneGroup.position.y = Math.sin(time * 2) * 0.5; // Hover effect

            // Animate Bubbles
            bubbles.forEach(bubble => {
                bubble.position.y += bubble.userData.speed;
                bubble.position.x += Math.sin(time * bubble.userData.wobbleSpeed + bubble.userData.wobbleOffset) * 0.02;

                // Reset bubble if it floats too high
                if (bubble.position.y > 15) {
                    bubble.position.y = -15;
                    bubble.position.x = (Math.random() - 0.5) * 30;
                }
            });

            renderer.render(scene, camera);
        }

        // 8. Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start Animation
        animate();
    </script>
</body>
</html>
